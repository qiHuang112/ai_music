name: Android signed release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Plan version and skip already published or superseded commits
        id: plan
        run: python3 tool/github_android_release.py plan
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.plan.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.plan.outputs.skip != 'true'
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Check code
        if: steps.plan.outputs.skip != 'true'
        run: |
          flutter pub get
          flutter analyze
          flutter test
          python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Configure Android signing
        if: steps.plan.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AI_MUSIC_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AI_MUSIC_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AI_MUSIC_STOREPASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          python3 tool/github_android_release.py signing
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.11718014'
      - name: Build signed arm64 APK
        if: steps.plan.outputs.skip != 'true'
        env:
          AI_MUSIC_STOREFILE: ${{ runner.temp }}/ai-music-release.jks
          AI_MUSIC_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AI_MUSIC_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AI_MUSIC_STOREPASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          flutter build apk --release --no-pub --target-platform android-arm64 --split-per-abi \
            --build-name "${{ steps.plan.outputs.name }}" --build-number "${{ steps.plan.outputs.number }}"
      - name: Verify and publish to GitHub Releases
        if: steps.plan.outputs.skip != 'true'
        run: python3 tool/github_android_release.py publish
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/ai-music-release.jks"
