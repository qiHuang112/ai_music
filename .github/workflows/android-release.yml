name: Android, macOS and iOS release

# Releases are minted only on request ("推送／发GitHub": push main, then
# `gh workflow run android-release.yml --ref main`). Every push is checked by
# ci.yml without producing a release, so commits no longer need [skip ci].
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Plan version and skip already published or superseded commits
        id: plan
        run: python3 tool/github_android_release.py plan
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.plan.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.plan.outputs.skip != 'true'
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Check code
        if: steps.plan.outputs.skip != 'true'
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Configure Android signing
        if: steps.plan.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AI_MUSIC_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AI_MUSIC_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AI_MUSIC_STOREPASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          python3 tool/github_android_release.py signing
          shopt -s nullglob
          android_sdk_managers=("$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager)
          if (( ${#android_sdk_managers[@]} == 0 )); then
            echo 'Android SDK command-line tools are missing' >&2
            exit 1
          fi
          # Answer the required SDK/NDK license prompts in this unattended job.
          # Ignore yes's SIGPIPE after sdkmanager has consumed its input; keep
          # sdkmanager's own exit status and restore pipefail for later commands.
          set +o pipefail
          yes | "${android_sdk_managers[0]}" --sdk_root="$ANDROID_HOME" \
            'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.11718014'
          set -o pipefail
      - name: Build signed arm64 APK
        if: steps.plan.outputs.skip != 'true'
        env:
          AI_MUSIC_STOREFILE: ${{ runner.temp }}/ai-music-release.jks
          AI_MUSIC_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AI_MUSIC_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AI_MUSIC_STOREPASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          flutter build apk --release --no-pub --target-platform android-arm64 --split-per-abi \
            --build-name "${{ steps.plan.outputs.name }}" --build-number "${{ steps.plan.outputs.number }}"
      - name: Verify and publish to GitHub Releases
        if: steps.plan.outputs.skip != 'true'
        run: python3 tool/github_android_release.py publish
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/ai-music-release.jks"

  macos:
    name: macOS Universal release
    needs: release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reuse this commit's Android release version
        id: plan
        run: python3 tool/github_macos_release.py plan
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.plan.outputs.skip != 'true'
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Build macOS Universal release
        if: steps.plan.outputs.skip != 'true'
        run: |
          flutter pub get --enforce-lockfile
          flutter build macos --release --no-pub \
            --build-name "${{ steps.plan.outputs.name }}" --build-number "${{ steps.plan.outputs.code }}"
      - name: Verify and attach macOS to the same GitHub Release
        if: steps.plan.outputs.skip != 'true'
        run: python3 tool/github_macos_release.py publish

  ios:
    name: iOS resignable IPA
    needs: release
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reuse this commit's release version
        id: plan
        run: python3 tool/github_ios_release.py plan
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.plan.outputs.skip != 'true'
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Build unsigned iOS release
        if: steps.plan.outputs.skip != 'true'
        run: |
          xcodebuild -version
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-pub --no-codesign \
            --build-name "${{ steps.plan.outputs.name }}" --build-number "${{ steps.plan.outputs.code }}"
      - name: Package, verify and attach resignable IPA
        if: steps.plan.outputs.skip != 'true'
        run: python3 tool/github_ios_release.py publish
