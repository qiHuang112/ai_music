name: ai_music
description: "Cross-platform music search, cache, and playback app."
publish_to: 'none'
version: 1.0.0-lan.2+2102

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  audio_session_harmonyos: ^0.0.1
  crypto: ^3.0.7
  connectivity_plus: ^6.1.5
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  image_picker: ^1.2.3
  image_picker_android: 0.8.13+23
  image_picker_platform_interface: 2.11.1
  just_audio: ^0.10.5
  just_audio_harmonyos:
    path: third_party/just_audio_harmonyos
  path_provider: 2.1.5
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  just_audio_platform_interface: ^4.6.0

flutter:
  uses-material-design: true
